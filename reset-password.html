<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password — Yılkı Games</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='%23d9262a' text-anchor='middle'>Y</text></svg>"
    />
    <style>
      /* Bu sayfaya özel; ortak style.css'te form yok. */
      .form-alan { margin: 22px 0; }
      .form-alan label {
        display: block; margin-bottom: 8px; font-weight: 600; font-size: 15px;
      }
      .form-alan input {
        width: 100%; padding: 14px 16px; font-size: 16px;
        border-radius: 12px; border: 2px solid #2a2a2e;
        background: #141417; color: #f2f2f4;
      }
      .form-alan input:focus { outline: none; border-color: #d9262a; }
      .gonder {
        width: 100%; padding: 16px; font-size: 17px; font-weight: 700;
        border: none; border-radius: 12px; cursor: pointer;
        background: #d9262a; color: #fff;
      }
      .gonder:disabled { opacity: .5; cursor: default; }
      .durum { margin-top: 18px; font-size: 15px; line-height: 1.6; }
      .durum.hata { color: #ff6b6e; }
      .durum.tamam { color: #4ade80; }
      .ipucu { font-size: 14px; color: #8a8a93; margin-top: 6px; }
    </style>
  </head>
  <body>
    <header>
      <div class="sarmal ust">
        <a class="marka" href="/">
          <span class="marka-isaret" aria-hidden="true">
            <i>X</i><i>O</i><i>X</i>
          </span>
          YILKI GAMES
        </a>
        <div class="ust-sag">
          <nav id="ana-nav">
            <a href="/destek.html">Support</a>
            <a href="/sifre-sifirla.html">Türkçe</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="sarmal belge">
      <h1>Reset Password</h1>

      <div id="form-kutu" hidden>
        <p>Choose a new password for your XOXD account.</p>

        <div class="form-alan">
          <label for="sifre1">New password</label>
          <input id="sifre1" type="password" autocomplete="new-password"
                 minlength="6" />
          <p class="ipucu">At least 6 characters.</p>
        </div>

        <div class="form-alan">
          <label for="sifre2">New password (again)</label>
          <input id="sifre2" type="password" autocomplete="new-password"
                 minlength="6" />
        </div>

        <button id="gonder" class="gonder" type="button">CHANGE PASSWORD</button>
      </div>

      <p id="durum" class="durum"></p>

      <p class="ipucu" id="yardim" hidden>
        If the problem persists, write to
        <a href="mailto:info@yilkigames.com">info@yilkigames.com</a>
        
      </p>
    </main>

    <footer>
      <div class="sarmal alt">
        <span>© 2026 Yılkı Games</span>
        <span class="alt-baglantilar">
          <a href="/">Yılkı Games</a>
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/destek.html">Support</a>
        </span>
      </div>
    </footer>

    <script>
      /* Supabase şifre sıfırlama bağlantısı bu sayfaya
         #access_token=...&type=recovery biçiminde döner. Jeton adres
         çubuğunun # kısmında geldiği için sunucuya hiç gitmez; sadece
         tarayıcıda kalır.

         Buradaki anon anahtar herkese açık bir anahtardır (oyunun içinde
         de var) — tek başına hiçbir veriye erişim vermez, yetkiyi
         yukarıdaki jeton belirler. */
      (function () {
        "use strict";

        var API = "https://qivsymbcxicaeldfveqn.supabase.co";
        var ANON =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpdnN5bWJjeGljYWVsZGZ2ZXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTI1MTgsImV4cCI6MjA5NDI2ODUxOH0.03Q5RWDfndR072r8YyK8sDSILC944hHqK95Mev1VgKY";

        var durum = document.getElementById("durum");
        var yardim = document.getElementById("yardim");
        var kutu = document.getElementById("form-kutu");
        var gonder = document.getElementById("gonder");
        var s1 = document.getElementById("sifre1");
        var s2 = document.getElementById("sifre2");

        function yaz(mesaj, sinif) {
          durum.textContent = mesaj;
          durum.className = "durum" + (sinif ? " " + sinif : "");
        }

        var parcalar = new URLSearchParams(location.hash.replace(/^#/, ""));
        var jeton = parcalar.get("access_token");
        var tur = parcalar.get("type");
        var hataAciklama = parcalar.get("error_description");

        if (hataAciklama) {
          yaz("This link is invalid or has expired: " + hataAciklama +
              " You can request a new reset from the game.", "hata");
          yardim.hidden = false;
          return;
        }

        if (!jeton || tur !== "recovery") {
          yaz("This page only works from the reset link in your e-mail. If you " +
              "pasted the link manually, make sure the long part at the end " +
              "was copied too.",
              "hata");
          yardim.hidden = false;
          return;
        }

        /* Jetonu adres çubuğundan siliyoruz: kullanıcı sayfayı paylaşırsa
           ya da geçmişte kalırsa tek kullanımlık anahtar da gitmesin. */
        history.replaceState(null, "", location.pathname);

        kutu.hidden = false;

        gonder.addEventListener("click", function () {
          var a = s1.value;
          var b = s2.value;

          if (a.length < 6) {
            yaz("Password must be at least 6 characters.", "hata");
            return;
          }
          if (a !== b) {
            yaz("The two passwords do not match.", "hata");
            return;
          }

          gonder.disabled = true;
          yaz("Sending…");

          fetch(API + "/auth/v1/user", {
            method: "PUT",
            headers: {
              apikey: ANON,
              Authorization: "Bearer " + jeton,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password: a })
          })
            .then(function (cevap) {
              return cevap.json().then(function (veri) {
                return { ok: cevap.ok, veri: veri };
              });
            })
            .then(function (sonuc) {
              if (sonuc.ok) {
                kutu.hidden = true;
                yaz("Your password has been changed. You can now sign in to the game " +
                    "with your new password.", "tamam");
              } else {
                gonder.disabled = false;
                /* Sunucu gelistirici diliyle konusuyor; kullaniciya ne
                   yapacagini soyleyen bir karsilik gosteriyoruz. */
                var ham = (sonuc.veri && (sonuc.veri.msg || sonuc.veri.message ||
                          sonuc.veri.error_description)) || "";
                var mesaj;
                if (/jwt|token|expired|invalid|session/i.test(ham)) {
                  mesaj = "This link has expired or has already been used. " +
                          "Request a new password reset from the game.";
                } else if (/different from the old|same.*password/i.test(ham)) {
                  mesaj = "The new password must be different from the old one.";
                } else if (/at least|should be|weak|short/i.test(ham)) {
                  mesaj = "That password is not strong enough. Try a longer one.";
                } else if (/rate|too many/i.test(ham)) {
                  mesaj = "Too many attempts. Please try again in a few minutes.";
                } else {
                  mesaj = "Could not change the password. Please try again later.";
                }
                yaz(mesaj, "hata");
                yardim.hidden = false;
              }
            })
            .catch(function () {
              gonder.disabled = false;
              yaz("Could not reach the server. Check your connection and try again.",
                  "hata");
              yardim.hidden = false;
            });
        });
      })();
    </script>
  </body>
</html>
